name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen development dependencies
        run: >-
          python -m pip install
          -c requirements/constraints-py311-313.txt
          -e ".[dev]"
      - name: Ruff
        run: ruff check src tests scripts
      - name: Tests
        run: python -m pytest -q
      - name: Verify immutable strategy registry
        run: python -m pytest -q tests/test_strategy.py
