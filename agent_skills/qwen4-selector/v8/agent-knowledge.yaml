schema_version: "1.0"
knowledge_id: human-visual-retargeting-cases
version: "1.0.0"
cases:
  - case_id: border_contact_not_missing
    situation: 主体接触画面边缘，但身份、脸和有意义的身体部分仍连贯。
    expected_judgement: 不因贴边自动失败；构图可发布时给 A/B。
    rationale: 紧凑取景不等于删除主体。
    counterexample: 脸、关键肢体、商品或伴侣被切到改变身份或关系。
  - case_id: clean_secondary_crop
    situation: 次要群众、装饰文案或低优先级边缘信息被干净裁掉，核心传播完整。
    expected_judgement: 通常给 A/B。
    rationale: 业务可用性优先于逐像素完整。
  - case_id: global_aspect_tolerance
    situation: 存在均匀比例变化，但人物、文字和显著物体仍自然。
    expected_judgement: 通常给 B；肉眼不受影响时可给 A。
    rationale: 目标比例变化本身不是缺陷。
    counterexample: 局部解剖、文字或刚性结构发生独立弯曲。
  - case_id: main_relation_loss
    situation: 情侣、群体互动或人商品关系变成孤立单主体。
    expected_judgement: 核心叙事改变给 D，否则至少 C。
    rationale: 实例关系属于语义内容。
  - case_id: rigid_object_damage
    situation: 显著乐器、伞、框架、包装或 Logo 弯折、夹扁或复制。
    expected_judgement: 给 C；大面积发布事故给 D。
    rationale: 刚性结构的非物理形变在正常观看尺寸下明显。
  - case_id: detector_visual_conflict
    situation: OCR 或数量指标下降，但高清原图候选对显示内容完整可读。
    expected_judgement: 降低检测器证据置信度，保留视觉可发布的 A/B。
    rationale: 检测失败不等于图片真的损坏。
  - case_id: dominant_title_role
    situation: 人物仍在，但海报主标题、活动标或主 Logo 丢失或明显损坏。
    expected_judgement: 需要修复给 C；严重误导或破坏才给 D。
    rationale: 主视觉文字本身就是核心主体。
    counterexample: 小演职员表、法务小字或次要平台标被干净裁掉。
  - case_id: aesthetic_crop_over_similarity
    situation: 裁剪移除次要细节但得到均衡自然画面，另一高相似候选有明显拉伸。
    expected_judgement: 优先自然裁剪。
    rationale: 人类视觉偏好不等于像素相似度最大。
  - case_id: combined_medium_defects
    situation: 单项缺陷都不致命，但主脸、关键道具和主标题分别存在可见损伤。
    expected_judgement: 组合后已需要返修时给 C。
    rationale: 多个中等缺陷叠加后会跨过可直接发布边界。
  - case_id: identity_count_disagreement
    situation: 检测器数量保持不变，但主人物身份、角色关系或身体比例发生明显变化。
    expected_judgement: 按严重程度给 C 或 D，不受数量指标限制。
    rationale: 数量一致不能证明语义与人物身份一致。
  - case_id: typography_ocr_disagreement
    situation: OCR 字符相似，但主标题存在断笔、重复条带或明显字形扭曲。
    expected_judgement: 设计人员需要返修时给 C。
    rationale: OCR 语义召回不能衡量字体的视觉完整性。
    counterexample: 艺术字造成 OCR 差异，但高清图中文字仍连贯且可读。
  - case_id: two_challenger_diversity
    situation: Rule Top1 在软指标上占优，两个较低排名方法分别体现裁切与形变的不同取舍。
    expected_judgement: 选择视觉最强且方法不同的两个挑战候选做独立高清配对复核。
    rationale: 只看一个挑战候选可能漏掉更符合人类偏好的取舍。
