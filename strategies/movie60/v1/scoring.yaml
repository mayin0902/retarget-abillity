schema_version: "1.0"
policy_id: movie60-scoring-v1
version: "1.0.0"
implementation: auto_proxy_v1
evaluator_id: auto-quality-proxy-v1
evaluator_version: "1.0.2"
max_analysis_edge: 1024
proxy_a_threshold: 80.0
proxy_b_threshold: 60.0
proxy_c_threshold: 0.0
critical_text_recall: 0.15
blank_std_threshold: 1.5
prominent_face_confidence: 0.75
prominent_face_area_ratio: 0.015
direct_warp_proxy_a_cap_d_stretch: null
direct_warp_proxy_c_cap_d_stretch: null
total_weights: {content: 0.50, integrity: 0.30, composition: 0.20}
text_weights: {character_recall: 0.65, sequence_similarity: 0.35}
content_weights:
  {feature: 0.25, text: 0.35, face: 0.20, person: 0.20, product: 0.20, logo: 0.10, object: 0.20}
integrity_weights:
  {sharpness: 0.25, edge_density: 0.20, color: 0.15, structure_lines: 0.20, transform_safety: 0.20}
composition_weights: {protected_border: 0.60, visual_center: 0.40}
transform_penalties:
  {direct_warp_stretch: 0.65, crop_cut_must_keep: 2.0, seam_importance: 1.5, seam_anisotropy: 0.6, mesh_anisotropy: 0.55, mesh_foldover: 8.0}
